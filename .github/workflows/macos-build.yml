name: macOS Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "macos-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    env:
      # The p12 certificate and p8 API key are stored as GitHub Actions secrets.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare macOS package
        run: npm run prepare:package

      - name: Check Apple signing and notarization secrets
        shell: bash
        run: |
          test -n "$CSC_LINK" || { echo "Missing CSC_LINK"; exit 1; }
          test -n "$CSC_KEY_PASSWORD" || { echo "Missing CSC_KEY_PASSWORD"; exit 1; }
          test -n "$APPLE_API_KEY" || { echo "Missing APPLE_API_KEY"; exit 1; }
          test -n "$APPLE_API_KEY_ID" || { echo "Missing APPLE_API_KEY_ID"; exit 1; }
          test -n "$APPLE_API_ISSUER" || { echo "Missing APPLE_API_ISSUER"; exit 1; }

      - name: Build macOS installers
        run: npx --no-install electron-builder --mac dmg zip --publish never -c.mac.notarize=true -c.mac.forceCodeSigning=true

      - name: Verify packaged macOS Runtime
        run: node scripts/verify-runtime-bundle.mjs "dist/mac-arm64/EzDSH.app/Contents/Resources"

      - name: Check macOS package files
        shell: bash
        run: |
          test -f out/node-runtime/bin/node
          test -f node_modules/@deepseek-ai/dsh/lib/bin.js
          compgen -G "dist/*.dmg" > /dev/null
          compgen -G "dist/*.zip" > /dev/null
          test -f dist/latest-mac.yml
          compgen -G "dist/*.blockmap" > /dev/null

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: EzDSH-macOS-signed-and-notarized
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publish macOS installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$tag" == v* ]]; then
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "EzDSH $tag" \
                --generate-notes || \
                gh release view "$tag" --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --title "EzDSH $tag" \
                --generate-notes \
                --prerelease || \
                gh release view "$tag" --repo "$GITHUB_REPOSITORY"
            fi
          fi
          gh release upload "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            dist/*.dmg \
            dist/*.zip \
            dist/latest-mac.yml \
            dist/*.blockmap \
            --clobber
