name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run package:win

      - name: Create temporary self-signed certificate
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=EzDSH Local Build" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(10)

          $password = "ezdsh-${{ github.run_id }}"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP "ezdsh-signing.pfx"
          $cerPath = Join-Path $env:GITHUB_WORKSPACE "dist\EzDSH-Local-Build.cer"

          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

          "EZDSH_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append
          "EZDSH_CERT_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

      - name: Sign Windows installer
        shell: pwsh
        run: |
          $signTool = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" `
            -ErrorAction Stop |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          Get-ChildItem "dist\*.exe" | ForEach-Object {
            & $signTool.FullName sign `
              /fd SHA256 `
              /f $env:EZDSH_PFX_PATH `
              /p $env:EZDSH_CERT_PASSWORD `
              $_.FullName

            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed for $($_.FullName)"
            }
          }

      - name: Verify signatures
        shell: pwsh
        run: |
          Get-ChildItem "dist\*.exe" | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -ne "Valid") {
              throw "Invalid signature for $($_.FullName): $($signature.Status)"
            }
            Write-Host "$($_.Name): $($signature.Status) - $($signature.SignerCertificate.Subject)"
          }

      - name: Upload Windows installer and certificate
        uses: actions/upload-artifact@v4
        with:
          name: EzDSH-Windows-self-signed
          path: |
            dist/*.exe
            dist/EzDSH-Local-Build.cer
          if-no-files-found: error
