name: Windows Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "windows-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Windows package
        run: npm run prepare:package

      - name: Create temporary self-signed certificate
        shell: pwsh
        run: |
          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=EzDSH Local Build" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(10)

          $password = "ezdsh-${{ github.run_id }}"
          $securePassword = ConvertTo-SecureString $password -AsPlainText -Force
          $pfxPath = Join-Path $env:RUNNER_TEMP "ezdsh-signing.pfx"
          $cerPath = Join-Path $env:RUNNER_TEMP "EzDSH-Local-Build.cer"

          Export-PfxCertificate -Cert $certificate -FilePath $pfxPath -Password $securePassword | Out-Null
          Export-Certificate -Cert $certificate -FilePath $cerPath | Out-Null

          "EZDSH_PFX_PATH=$pfxPath" | Out-File $env:GITHUB_ENV -Append
          "EZDSH_CERT_PASSWORD=$password" | Out-File $env:GITHUB_ENV -Append

      - name: Build Windows installer
        env:
          CSC_LINK: ${{ env.EZDSH_PFX_PATH }}
          CSC_KEY_PASSWORD: ${{ env.EZDSH_CERT_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Copy certificate to Windows artifacts
        shell: pwsh
        run: |
          $distPath = Join-Path $env:GITHUB_WORKSPACE "dist"
          $cerPath = Join-Path $distPath "EzDSH-Local-Build.cer"
          New-Item -ItemType Directory -Force -Path $distPath | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "EzDSH-Local-Build.cer") $cerPath -Force

      - name: Verify packaged Windows Runtime
        run: node scripts/verify-runtime-bundle.mjs "dist/win-unpacked/resources"

      - name: Check Windows package files
        shell: pwsh
        run: |
          if (-not (Test-Path "out\node-runtime\bin\node.exe")) {
            throw "Bundled Windows Node runtime is missing"
          }
          if (-not (Test-Path "node_modules\@deepseek-ai\dsh\lib\bin.js")) {
            throw "Bundled DSH Runtime entry is missing"
          }
          if (-not (Get-ChildItem "dist\*.exe" -ErrorAction SilentlyContinue)) {
            throw "Windows installer was not generated"
          }
          if (-not (Test-Path "dist\latest.yml")) {
            throw "Windows update metadata latest.yml was not generated"
          }
          if (-not (Get-ChildItem "dist\*.blockmap" -ErrorAction SilentlyContinue)) {
            throw "Windows differential update blockmap was not generated"
          }

      - name: Verify signatures
        shell: pwsh
        run: |
          Get-ChildItem "dist\*.exe" | ForEach-Object {
            $signature = Get-AuthenticodeSignature $_.FullName
            if ($signature.Status -eq "NotSigned" -or $null -eq $signature.SignerCertificate) {
              throw "Missing Authenticode signature for $($_.FullName): $($signature.Status)"
            }
            Write-Host "$($_.Name): $($signature.Status) - $($signature.SignerCertificate.Subject)"
          }

      - name: Rewrite update metadata with absolute URLs
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/rewrite-update-metadata.mjs dist/latest.yml

      - name: Upload Windows installer and certificate
        uses: actions/upload-artifact@v4
        with:
          name: EzDSH-Windows-self-signed
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.blockmap
            dist/EzDSH-Local-Build.cer
          if-no-files-found: error

      - name: Publish Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($tag.StartsWith("v")) {
              gh release create $tag `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "EzDSH $tag" `
                --generate-notes
            } else {
              gh release create $tag `
                --repo $env:GITHUB_REPOSITORY `
                --verify-tag `
                --title "EzDSH $tag" `
                --generate-notes `
                --prerelease
            }
            if ($LASTEXITCODE -ne 0) {
              gh release view $tag --repo $env:GITHUB_REPOSITORY
            }
          }
          $assets = @(Get-ChildItem "dist\*.exe" | Select-Object -ExpandProperty FullName)
          $assets += @(Get-ChildItem "dist\*.blockmap" | Select-Object -ExpandProperty FullName)
          $assets += (Join-Path $env:GITHUB_WORKSPACE "dist\latest.yml")
          $assets += (Join-Path $env:GITHUB_WORKSPACE "dist\EzDSH-Local-Build.cer")
          gh release upload $tag `
            $assets `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
